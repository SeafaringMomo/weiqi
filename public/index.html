<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>围棋 · weiqi-app</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>围棋</h1>
        <div class="topbar-actions">
          <button id="btn-new" class="btn btn-ghost" type="button">新对局</button>
        </div>
      </header>

      <!-- Setup: shown when there is no ?game= parameter -->
      <section id="setup" class="panel setup" hidden>
        <h2>开始新对局</h2>
        <label class="field">
          <span>棋盘路数</span>
          <select id="opt-size">
            <option value="19">19 路</option>
            <option value="13">13 路</option>
            <option value="9">9 路</option>
          </select>
        </label>
        <label class="field">
          <span>我执</span>
          <select id="opt-color">
            <option value="white">白棋（Agent 执黑先行）</option>
            <option value="black">黑棋（我先行）</option>
          </select>
        </label>
        <button id="btn-create" class="btn btn-primary" type="button">创建对局</button>
        <div id="recent" class="recent"></div>
        <p id="setup-error" class="error" hidden></p>
      </section>

      <!-- Game view -->
      <section id="game" class="game" hidden>
        <div class="board-wrap">
          <canvas id="board" aria-label="围棋棋盘"></canvas>
        </div>

        <aside class="sidebar">
          <div class="status-card">
            <div class="status-phase" id="phase">对弈中</div>
            <div class="status-turn" id="turn">黑方行棋</div>
            <div class="score-panel" id="score-panel" hidden>
              <div class="score-row"><span>黑</span><b id="score-black">—</b></div>
              <div class="score-row"><span>白</span><b id="score-white">—</b></div>
              <div class="score-row muted"><span>贴子</span><b id="score-komi">—</b></div>
              <div class="score-result" id="score-result"></div>
            </div>
            <div class="result-banner" id="result-banner" hidden></div>
          </div>

          <div class="captures">
            <div class="cap-row"><span class="stone-dot black"></span>提子 <b id="cap-black">0</b></div>
            <div class="cap-row"><span class="stone-dot white"></span>提子 <b id="cap-white">0</b></div>
          </div>

          <div class="msg" id="msg" hidden></div>

          <div class="actions">
            <button id="btn-pass" class="btn" type="button">虚着</button>
            <button id="btn-resign" class="btn btn-danger" type="button">认输</button>
            <button id="btn-confirm" class="btn btn-primary" type="button" hidden>确认数子</button>
          </div>

          <div class="hint" id="hint"></div>
          <div class="game-id">对局 <code id="game-id"></code></div>
        </aside>
      </section>
    </main>
    <script src="/dist/bundle.js"></script>
  </body>
</html>
